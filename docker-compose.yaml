name: openflightradar

services:
  db:
    image: postgres:17-alpine
    container_name: ofr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ofr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ofr}
      POSTGRES_DB: ${POSTGRES_DB:-ofr}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ofr-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
